name: MinGW

on: 
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.gitattributes'
      - 'res/**'
      - '**.cmd'
      - '**.md'
      - '**.rc'
      - '**.sh'
      - '**.txt'
      - '**.xml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - 'res/**'
      - '**.cmd'
      - '**.md'
      - '**.rc'
      - '**.sh'
      - '**.txt'
      - '**.xml'

jobs:
  MinGW-Build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - { sys: mingw64, env: x86_64, exe: rufus.exe }
          - { sys: mingw32, env: i686, exe: rufus_x86.exe }
          - { sys: ucrt64,  env: ucrt-x86_64, exe: rufus_ucrt.exe }

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Install MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          mingw-w64-${{ matrix.env }}-toolchain
          base-devel
          autotools
          git
          upx

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set ALPHA
      id: set_alpha
      shell: bash
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # This ONLY works if the shell is bash or if using $env:GITHUB_OUTPUT
      run: |
        echo "option=--enable-alpha" >> $GITHUB_OUTPUT
        sed -b -i 's/VALUE "InternalName", "Rufus"/VALUE "InternalName", "Rufus (ALPHA)"/' ./src/rufus.rc

    - name: Set BETA
      id: set_beta
      shell: bash
      if: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'BETA') }}
      # This ONLY works if the shell is bash or if using $env:GITHUB_OUTPUT
      run: |
        echo "option=--enable-beta" >> $GITHUB_OUTPUT
        sed -b -i 's/VALUE "InternalName", "Rufus"/VALUE "InternalName", "Rufus (BETA)"/' ./src/rufus.rc

    - name: Build
      run: |
        ./configure --disable-debug ${{ steps.set_alpha.outputs.option }} ${{ steps.set_beta.outputs.option }}
        make -j4
        mv ./src/rufus.exe ./${{ matrix.exe }}
        strip ./${{ matrix.exe }}
        upx --lzma --best ./${{ matrix.exe }}

    - name: Display SHA-256
      run: sha256sum ./${{ matrix.exe }}

    - name: Upload artifacts
      if: ${{ github.event_name == 'push' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.sys }}
        path: ./*.exe

  # Any step of a job can read the secrets that job uses, so secrets are only used here,
  # in a job that runs no third-party actions, rather than in the build job.
  MinGW-Sign:
    runs-on: windows-latest
    needs: MinGW-Build
    if: ${{ github.event_name == 'push' }}
    permissions: {}

    strategy:
      matrix:
        include:
          - { sys: mingw64, env: x86_64, exe: rufus.exe }
          - { sys: mingw32, env: i686, exe: rufus_x86.exe }
          - { sys: ucrt64,  env: ucrt-x86_64, exe: rufus_ucrt.exe }

    env:
      HAS_SIGNING_KEY: ${{ secrets.RUFUS_GITHUB_OFFICIAL_BUILD != '' }}
      HAS_VIRUSTOTAL_KEY: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.sys }}

    - name: Sign ALPHA
      if: ${{ !startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true' }}
      shell: pwsh
      env:
        SIGNING_KEY: ${{ secrets.RUFUS_GITHUB_OFFICIAL_BUILD }}
      run: |
        $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
        $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_KEY))
        try {
          & $signtool sign /v /f $pfx /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 ${{ matrix.exe }}
        } finally {
          Remove-Item $pfx -Force
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Display SHA-256
      if: ${{ !startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true' }}
      run: sha256sum ./${{ matrix.exe }}

    - name: Upload to VirusTotal
      if: ${{ matrix.env == 'x86_64' && env.HAS_VIRUSTOTAL_KEY == 'true' }}
      continue-on-error: true
      run: |
        curl --request POST --url https://www.virustotal.com/vtapi/v2/file/scan --form apikey=${{ secrets.VIRUSTOTAL_API_KEY }} --form file=@./${{ matrix.exe }}
        curl --request POST --url https://www.virustotal.com/api/v3/monitor/items --header 'x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}' --form path='/${{ matrix.exe }}' --form file=@./${{ matrix.exe }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.sys }}
        overwrite: true
        path: ./*.exe

  Extra-Step-To-Merge-Artifacts-Thanks-To-Upload-Artifact-v4-Breaking-Backwards-Compatibility:
    runs-on: windows-latest
    needs: MinGW-Sign
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        if: ${{ github.event_name == 'push' }}
        with:
          name: MinGW
          delete-merged: true